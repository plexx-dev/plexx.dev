[package]
name = "conway"
version = "0.1.0"
edition = "2024"
description = "a small wasm conway sim"
license = "GPL-3.0"
repository = "https://github.com/plexx-dev/plexx.dev/tree/master/game_files/conway"

[lib]
crate-type = ["cdylib", "rlib"] # Compile as a shared library for WASM

[dependencies]
rand = "0.10.0"
getrandom = { version = "0.4.1", features = ["wasm_js"] }
wasm-bindgen = "0.2.108"

[dev-dependencies]
wasm-bindgen-test = "0.3.58"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
